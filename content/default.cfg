//
// UNHOLY -- commandes par defaut
//
// Une seule arme, une lampe, et rien d'autre. Les noms de commandes sont ceux
// du moteur (neo/framework/UsercmdGen.cpp) -- ce qui leur est attache est a
// UNHOLY. Le moteur lit ce fichier au demarrage, et s'en sert aussi pour
// verifier qu'il a trouve son dossier de donnees : sans lui, il s'arrete.
//

unbindall

// deplacement
bind	w			_forward
bind	s			_back
bind	a			_moveleft
bind	d			_moveright
bind	SHIFT		_speed			// sprint
bind	CTRL		_movedown		// accroupi
bind	c			_movedown
bind	SPACE		_moveup

// arme
bind	MOUSE1		_attack
bind	MOUSE2		_zoom			// epauler
bind	r			"_impulse13"	// recharger
bind	f			"_impulse16"	// lampe

// partie
bind	e			_use
bind	TAB			"_impulse19"	// scores
bind	F12			screenshot

// mise au point : le releve du deplacement
bind	F3			"toggle unholy_showMove"

// l'epaule se tient, il ne bascule pas
seta	in_toggleZoom	"0"

// Champ de vision horizontal, compte en 16/9 par le moteur (Doom 3 : 80).
seta	g_fov			"90"

// Pas de sauvegarde automatique en debut de niveau : une partie d'UNHOLY
// dure dix minutes et ne donne qu'une vie, il n'y a rien a reprendre.
seta	com_disableAutoSaves	"1"
